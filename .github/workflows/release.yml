name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - name: Validate release tag and branch
        id: release
        run: node scripts/check-release.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @futelab/folio build
      - name: Publish package with npm trusted publishing
        run: node scripts/publish-package.mjs
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          NPM_CONFIG_PROVENANCE: ${{ !github.event.repository.private }}
      - name: Create GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release already exists"
          elif [ "$DIST_TAG" = latest ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease --latest=false
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
