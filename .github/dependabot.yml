version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # DTS bundling requires the JavaScript compiler API supplied by TypeScript 6.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Follow the Node 24 runtime used in development and CI.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      tiptap:
        patterns: ["@tiptap/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
